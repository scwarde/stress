<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="减压小站：一个仅在本地保存数据的每日压力自测与减压工具。" />
  <title>减压小站</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%23c49cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3Cpath d='M20 35c8 8 16 8 24 0M24 26h.1M40 26h.1' stroke='white' stroke-width='4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <style>
    :root{--ink:#352d52;--muted:#77708d;--purple:#7659e7;--soft:#f7f4ff;--line:#ebe5ff;--shadow:0 14px 36px rgba(83,55,173,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 88% 6%,#eadeff 0,transparent 25%),radial-gradient(circle at 8% 22%,#f3eaff 0,transparent 25%),#fbfaff;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:16px;line-height:1.55}.app{max-width:1140px;margin:auto;padding:36px 22px 56px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;gap:12px;align-items:center}.mark{width:46px;height:46px;border-radius:17px;background:linear-gradient(135deg,#7355e7,#c69dff);display:grid;place-items:center;color:white;font-size:22px;box-shadow:0 8px 18px #bba8f166}.brand h1{font-size:24px;margin:0;letter-spacing:.03em}.brand p{margin:0;color:var(--muted);font-size:13px}.privacy{font-size:13px;color:#6047b8;background:#f0ebff;padding:7px 12px;border-radius:999px}.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:18px}.card{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.85);border-radius:26px;padding:24px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}.hero{background:linear-gradient(135deg,#7053dd,#b98df5);color:white;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-95px;background:#fff2}.eyebrow{font-size:13px;letter-spacing:.08em;opacity:.8}.hero h2{font-size:30px;line-height:1.25;margin:11px 0 9px;max-width:420px}.hero p{opacity:.9;margin:0 0 21px;max-width:450px}.btn{border:0;border-radius:14px;padding:12px 18px;background:white;color:#6248cf;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 7px 16px #3c1a7726;transition:.2s}.btn:hover{transform:translateY(-2px)}.btn.ghost{background:#f0ebff;color:#6248cf;box-shadow:none}.card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.card-title h3{margin:0;font-size:17px}.hint{font-size:13px;color:var(--muted)}.quote{font-size:19px;line-height:1.65;margin:7px 0 14px}.tag{display:inline-block;border-radius:99px;padding:4px 10px;background:#f0ebff;color:#7156c5;font-size:12px}.author{font-size:13px;color:var(--muted);margin-top:8px}.stats{margin-top:18px}.stats-head{display:flex;justify-content:space-between;align-items:end}.score{font-size:30px;font-weight:750;color:#6a4fce}.trend{font-size:13px;color:#786f94}.chart{height:146px;display:flex;align-items:flex-end;gap:11px;padding:13px 0 0}.bar-wrap{flex:1;text-align:center;font-size:11px;color:var(--muted)}.bar{min-height:4px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#bca4ff,#7253dd);margin-bottom:7px;transition:height .5s}.section{margin-top:18px}.library{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.method{border:1px solid var(--line);background:#fdfcff;border-radius:18px;padding:14px;cursor:pointer;transition:.2s}.method:hover{transform:translateY(-3px);box-shadow:0 10px 22px #6c4cbd18}.method .icon{font-size:22px}.method b{display:block;font-size:14px;margin:6px 0 2px}.method small{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.tab{border:0;background:#f1edff;color:#6d56bf;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}.tab.active{background:#7457df;color:white}.assessment{display:none;margin-top:18px}.assessment.open{display:block}.question{padding:15px 0;border-bottom:1px solid var(--line)}.question b{display:block;margin-bottom:10px}.options{display:flex;gap:8px;flex-wrap:wrap}.option{border:1px solid #ded5fb;background:#fff;border-radius:999px;padding:7px 10px;font-size:13px;cursor:pointer}.option:has(input:checked){background:#7659e7;color:#fff;border-color:#7659e7}.option input{position:absolute;opacity:0}.result{display:none;margin-top:17px;border-radius:18px;background:#f2edff;padding:16px}.result.show{display:block}.settings{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input{width:100%;border:1px solid #ded6f8;border-radius:12px;padding:11px;font:inherit;outline-color:#8064e5}.disclaimer{text-align:center;color:#89829c;font-size:12px;margin-top:25px}.modal{border:0;border-radius:24px;padding:0;width:min(470px,calc(100% - 28px));box-shadow:0 20px 60px #24154844}.modal::backdrop{background:#28203c55}.modal-inner{padding:25px}.modal h3{margin:0 0 8px}.steps{padding-left:20px;color:#544d6d}.close{float:right;border:0;background:#f1ecff;border-radius:10px;padding:6px 9px;cursor:pointer}@media(max-width:760px){.app{padding:22px 15px}.top{align-items:flex-start}.privacy{display:none}.grid{grid-template-columns:1fr}.library{grid-template-columns:repeat(2,1fr)}.settings{grid-template-columns:1fr}.hero h2{font-size:26px}.card{padding:19px}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="brand"><div class="mark">☁</div><div><h1>减压小站</h1><p>给情绪留一处松弛的角落</p></div></div><span class="privacy">数据只保存在此设备</span></header>
  <section class="grid"><article class="card hero"><div class="eyebrow">今日，先照顾好自己</div><h2>把压力说清楚，<br>也把自己轻轻接住。</h2><p>花一分钟做一次自测，认识当下的压力状态，并获得合适的减压建议。</p><button class="btn" id="startTest">开始压力自测　→</button></article>
  <article class="card"><div class="card-title"><h3>每日一句</h3><span id="quoteTag" class="tag"></span></div><p id="quoteText" class="quote"></p><div id="quoteAuthor" class="author"></div></article></section>
  <section class="grid stats"><article class="card"><div class="stats-head"><div><div class="card-title"><h3>近 7 天压力趋势</h3></div><div><span id="avgScore" class="score">—</span><span class="hint"> / 15 平均分</span></div></div><div id="trendText" class="trend">完成自测后显示趋势</div></div><div id="chart" class="chart" aria-label="近七天压力柱状图"></div></article>
  <article class="card"><div class="card-title"><h3>个性化偏好</h3><span class="hint">影响每日推荐</span></div><div class="settings"><div class="field"><label for="movie">喜欢的电影</label><input id="movie" placeholder="例如：心灵奇旅"></div><div class="field"><label for="book">喜欢的书籍</label><input id="book" placeholder="例如：小王子"></div><button class="btn ghost" id="savePrefs">保存</button></div></article></section>
  <section id="assessment" class="card assessment"><div class="card-title"><h3>压力自测</h3><span class="hint">5 题 · 每题 0–3 分</span></div><form id="testForm"></form><button class="btn" id="submitTest" type="button" style="margin-top:18px">查看结果</button><div id="result" class="result"></div></section>
  <section class="card section"><div class="card-title"><div><h3>减压方法库</h3><span class="hint" id="recommendation">完成自测后，我会为你推荐更合适的方法</span></div><div class="tabs" id="tabs"><button class="tab active" data-filter="all">全部</button><button class="tab" data-filter="low">轻度</button><button class="tab" data-filter="medium">中度</button><button class="tab" data-filter="high">较高</button></div></div><div id="library" class="library"></div></section>
  <p class="disclaimer">仅作健康提示，不用于诊断。如压力长期影响生活，请考虑咨询专业人士。</p>
</main><dialog id="methodDialog" class="modal"><div class="modal-inner"><button class="close" onclick="methodDialog.close()">关闭</button><div id="methodContent"></div></div></dialog>
<script>
const methods=[
 {n:'4-7-8 呼吸',i:'◌',l:['low','medium','high'],d:'用节律呼吸让身体慢慢安静下来。',s:['舒适坐好，轻轻吐气。','吸气 4 秒，屏息 7 秒。','缓缓呼气 8 秒，重复 4 轮。']},
 {n:'正念冥想',i:'☾',l:['medium','high'],d:'把注意力温柔地带回此刻。',s:['设定 3–5 分钟计时。','留意呼吸或身体触感。','走神时不评价，只是回到呼吸。']},
 {n:'散步十分钟',i:'♧',l:['low','medium'],d:'用轻微运动转换紧绷感。',s:['换上舒适的鞋，离开屏幕。','放慢脚步，留意风和光。','不必追求步数，走够十分钟即可。']},
 {n:'听一首歌',i:'♫',l:['low'],d:'借一段旋律让情绪流动。',s:['选一首让你感到安全的歌。','戴上耳机，闭眼或眺望远处。','听完再决定下一件小事。']},
 {n:'情绪日记',i:'✎',l:['medium','high'],d:'把脑中的噪音放到纸上。',s:['写下“我现在感到……”。','补充发生了什么、我需要什么。','不修改、不评判，写满三分钟。']},
 {n:'肩颈伸展',i:'⌁',l:['low','medium'],d:'给久坐和紧张的身体一点空间。',s:['缓慢转动肩膀 8 次。','头向两侧轻轻侧倾，各停 15 秒。','全程保持自然呼吸，不要用力拉扯。']},
 {n:'与人倾诉',i:'♡',l:['medium','high'],d:'让一个可靠的人陪你分担。',s:['选择让你安心的人。','先说“我想被听一会儿”。','只讲感受，也可以暂时不求建议。']},
 {n:'自由涂鸦',i:'✦',l:['low','medium','high'],d:'不需要画得好，只需让手先动起来。',s:['拿一张纸和一支笔。','随意画线条、色块或重复图形。','五分钟后停下，看看哪一处最有感觉。']}
];
const questions=['过去一周，你是否难以放松下来？','你是否感到事情太多、难以应对？','压力是否影响了你的睡眠或精力？','你是否容易烦躁、紧张或情绪低落？','你是否缺少属于自己的恢复时间？'];
const quotes=[
 {t:'“你不必把每件事都处理得完美。”',a:'《心灵奇旅》',tag:'电影 · 自我接纳',k:'心灵奇旅'},
 {t:'“重要的东西，用眼睛是看不见的。”',a:'《小王子》',tag:'书籍 · 温柔提醒',k:'小王子'},
 {t:'“愿你出走半生，归来仍是少年。”',a:'《愿你出走半生，归来仍是少年》',tag:'书籍 · 重新出发',k:'少年'},
 {t:'“生活总会有办法的。”',a:'《海蒂和爷爷》',tag:'电影 · 轻盈',k:'海蒂'},
 {t:'“我们终将上岸，阳光万里。”',a:'《你好，李焕英》',tag:'电影 · 希望',k:'你好'},
 {t:'“每一个不曾起舞的日子，都是对生命的辜负。”',a:'尼采',tag:'书籍 · 勇气',k:'尼采'}
];
const $=s=>document.querySelector(s), store={get:(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d)),set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
function dayKey(d){return d.toISOString().slice(0,10)}function renderQuote(){let p=store.get('ssPrefs',{}), day=Math.floor(Date.now()/864e5), match=quotes.find(q=>(p.movie||p.book||'').includes(q.k));let q=match||quotes[day%quotes.length];$('#quoteText').textContent=q.t;$('#quoteAuthor').textContent='— '+q.a;$('#quoteTag').textContent=q.tag}
function renderChart(){let data=store.get('ssScores',[]), days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let key=dayKey(d), entry=data.filter(x=>x.date===key).at(-1);days.push({label:(d.getMonth()+1)+'/'+d.getDate(),score:entry?.score??null})}let vals=days.filter(x=>x.score!==null).map(x=>x.score);$('#avgScore').textContent=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'—';$('#chart').innerHTML=days.map(x=>`<div class="bar-wrap"><div class="bar" style="height:${x.score===null?4:Math.max(12,x.score/15*108)}px;opacity:${x.score===null ? .24 : 1}"></div>${x.label}</div>`).join('');if(vals.length>1){let diff=vals.at(-1)-vals.at(-2);$('#trendText').textContent=diff===0?'与上次持平':diff>0?'较上次上升 '+diff+' 分':'较上次下降 '+Math.abs(diff)+' 分'}else $('#trendText').textContent=vals.length?'记录已保存，继续关注自己':'完成自测后显示趋势'}
function renderLibrary(filter='all'){let show=methods.filter(m=>filter==='all'||m.l.includes(filter));$('#library').innerHTML=show.map((m,i)=>`<article class="method" data-name="${m.n}"><div class="icon">${m.i}</div><b>${m.n}</b><small>${m.d}</small></article>`).join('');document.querySelectorAll('.method').forEach(el=>el.onclick=()=>openMethod(methods.find(m=>m.n===el.dataset.name)))}
function openMethod(m){$('#methodContent').innerHTML=`<div class="tag">${m.l.map(x=>x==='low'?'轻度':x==='medium'?'中度':'较高').join(' · ')}</div><h3>${m.i} ${m.n}</h3><p>${m.d}</p><ol class="steps">${m.s.map(x=>'<li>'+x+'</li>').join('')}</ol>`;$('#methodDialog').showModal()}
function setupTest(){ $('#testForm').innerHTML=questions.map((q,i)=>`<div class="question"><b>${i+1}. ${q}</b><div class="options">${['从不','偶尔','经常','几乎总是'].map((x,v)=>`<label class="option"><input required name="q${i}" value="${v}" type="radio">${v}（${v}）</label>`).join('')}</div></div>`).join('') }
$('#startTest').onclick=()=>{$('#assessment').classList.add('open');$('#assessment').scrollIntoView({behavior:'smooth',block:'start'})};$('#submitTest').onclick=()=>{let fd=new FormData($('#testForm'));if([...Array(5)].some((_,i)=>!fd.has('q'+i))){alert('请完成全部 5 道题，再查看结果。');return}let score=[...Array(5)].reduce((a,_,i)=>a+Number(fd.get('q'+i)),0), level=score<=5?'轻度':score<=10?'中度':'较高', advice=score<=5?'你目前的压力在可调节范围内。保持规律休息，并每天留一点放松时间。':score<=10?'你可能积累了一些压力。今天尝试为自己安排一项小小的恢复活动。':'你的压力感较明显。先减少不必要的消耗，考虑向信任的人或专业人士寻求支持。';let arr=store.get('ssScores',[]);arr.push({date:dayKey(new Date()),score});store.set('ssScores',arr);$('#result').className='result show';$('#result').innerHTML=`<b>本次得分 ${score}/15 · ${level}压力</b><br>${advice}`;$('#recommendation').textContent=`你的本次状态：${level}压力 · 已为你筛选合适的方法`;renderChart();renderLibrary(level==='轻度'?'low':level==='中度'?'medium':'high');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.filter===(level==='轻度'?'low':level==='中度'?'medium':'high')))};
$('#savePrefs').onclick=()=>{store.set('ssPrefs',{movie:$('#movie').value.trim(),book:$('#book').value.trim()});renderQuote();$('#savePrefs').textContent='已保存';setTimeout(()=>$('#savePrefs').textContent='保存',1400)};$('#tabs').onclick=e=>{if(e.target.dataset.filter){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===e.target));renderLibrary(e.target.dataset.filter)}};
let prefs=store.get('ssPrefs',{});$('#movie').value=prefs.movie||'';$('#book').value=prefs.book||'';setupTest();renderQuote();renderChart();renderLibrary();
</script></body></html>
